site_name: VIII Colóquio Kant e o Kantismo
site_description: Kantismo - Colóquio sobre Kant @UFPA
site_url: https://cunhapaulo.github.io/kant

repo_name: cunhapaulo/kant
repo_url: https://github.com/cunhapaulo/kant

copyright: Copyright &copy; 2008 - 2026 | Kant e o Kantismo (UFPa)

nav:
  - 'Página Inicial': index.md
  - 'Apresentação': apresentacao.md
  - 'Convidados': convidados.md
  - 'Conferencistas': conferencistas.md
  - 'Programação': programa.md
  - 'Inscrições': inscricao.md
  - 'PPGFIL 15 anos': 
      - 'Logo comemorativa': ppgfil15.md
  - Memória:
      - 'Pôster do Colóquio': poster.md
      - 'Eventos Passados': historico.md

theme:
  name: material
  language: pt-BR
  logo: assets/ufpa.png

  features:
    - header.autohide
    - search.highlight
    - search.suggest
    - navigation.footer
    - navigation.expand
    - navigation.sections
    - navigation.indexes
    - navigation.top    
    - navigation.instant
    - navigation.instant.progress
    - toc.integrate
    - toc.follow
    # - navigation.tabs

  font:
    text: "Fira Sans"
    code: "Jetbrains Mono"
    # text: Roboto
    # text: Merriweather
    # text: Merriweather Sans
    # text: Raleway
    # text: Jetbrains Mono
    # text: Open Sans
    # text: Libertinus Math
    # text: Libre Baskerville
    # text: DM Sans

  # palette: 
    # - media: "(prefers-color-scheme)"
    #   toggle:
    #     icon: material/link
    #     name: Alternar para o modo claro
    # - media: "(prefers-color-scheme: light)"
    #   scheme: default
    #   primary: indigo
    #   accent: indigo
    #   toggle:
    #     icon: material/toggle-switch
    #     name: Alternar para o modo escuro
    # - media: "(prefers-color-scheme: dark)"
    #   scheme: slate
    #   primary: indigo
    #   accent: red
    #   toggle:
    #     icon: material/toggle-switch-off
    #     name: Alternar para a preferência do sistema

markdown_extensions:
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg        
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true    
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format      

extra:
  social:
